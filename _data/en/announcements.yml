- zh_title: '2026年8月25日，团队负责人傅隆生教授应邀参加中国农学会智慧农业分会2026智慧农业产学研生态年会，作题为《农机农艺融合驱动的猕猴桃全程智能化生产》的主旨报告，分享团队在特色果园智能化生产与农业机器人领域的最新研究进展。'
