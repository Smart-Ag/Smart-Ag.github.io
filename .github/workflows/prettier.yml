name: Prettier code formatter

on:
  pull_request:
    branches: [ master, main ]
  # push 事件不再触发自动提交，避免循环

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install Prettier
        run: npm install --save-dev --save-exact prettier @shopify/prettier-plugin-liquid

      - name: Prettier Auto Fix (non-fork PR)
        if: github.event.pull_request.head.repo.fork == false && github.event_name == 'pull_request'
        run: npx prettier . --write

      - name: Auto Commit
        if: github.event.pull_request.head.repo.fork == false && github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto fix prettier format by CI"

      - name: Prettier Check (fork PR or push)
        if: github.event.pull_request.head.repo.fork == true || github.event_name == 'push'
        run: npx prettier . --check